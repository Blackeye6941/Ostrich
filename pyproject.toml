[project]
name = "ostrich"
version = "0.1.0"
description = "A desktop AI agent"
readme = "README.md"
authors = [
    { name = "Abhiram A R", email = "abhiramajithr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ostrich = "ostrich.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
