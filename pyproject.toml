[project]
name = "ostrich"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhiram A R", email = "abhiramajithr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai[google-genai,tools]>=1.15.14",
    "mlflow>=3.15.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
ostrich = "ostrich.main:main"
run_crew = "agent.flow:kickoff"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
